# Modified keys (Shift/Alt/Ctrl chords) survive the trip through tmux.
#
# With extended-keys off, tmux reports only standard keys to the pane: Shift is
# discarded outright (Shift+Enter arrives as a bare Enter, indistinguishable
# from it) and Alt degrades to a legacy ESC prefix that programs negotiating
# CSI-u ignore. The extkeys feature is what makes tmux request the extended
# encoding from the outer terminal in the first place; iTerm2 reports itself as
# xterm-256color, so it is matched by the xterm* pattern.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Report chords as CSI-u (\e[13;2u), the encoding iTerm2 emits natively, rather
# than tmux's default xterm modifyOtherKeys form (\e[27;2;13~). Programs then
# see the same bytes inside tmux as outside it.
set -s extended-keys-format csi-u

# A terminal window's session dies with the window; an explicit detach keeps it.
#
# ~/.zshrc execs `tmux new-session` for every interactive shell, so one terminal
# window owns exactly one session. That hand-off marks the session with
# @window_session and turns on destroy-unattached, which reaps a session the moment
# its last client goes - which is what closing the window does. Detaching with the
# prefix key clears the option first, so a session parked on purpose stays until a
# window picks it up again and re-arms it. Sessions that never had a client (`tmux
# new -d` from a script or an agent) carry neither the marker nor the option, so they
# survive the reaping pass that a window close triggers.
#
# Both hooks are needed: a client that attaches fresh fires only client-attached, and
# one that switches to another session (`attach`/`switch-client` from inside tmux)
# fires only client-session-changed.
#
# A dead client is all tmux sees, so a terminal that crashes or is force-quit takes
# its sessions with it exactly as a deliberate close does.
bind d set destroy-unattached off \; detach-client
set-hook -g client-attached 'if -F "#{@window_session}" "set destroy-unattached on"'
set-hook -g client-session-changed 'if -F "#{@window_session}" "set destroy-unattached on"'

# New windows and splits open in the directory of the pane they were created
# from. Without -c, tmux uses the session's creation directory, which is fixed
# for the life of the session and so drifts away from wherever you actually are.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# The shell announces its cwd to the terminal with OSC 7, but tmux consumes that
# sequence into #{pane_path} instead of passing it on. The terminal emulator's own
# idea of the current directory therefore never advances past the one the session
# started in, and it hands that stale directory to every window it opens - which,
# since ~/.zshrc gives each terminal window its own session, is every session too.
# This lets through the copy ~/.zshrc re-sends wrapped in tmux's DCS passthrough.
# `on` rather than `all` limits passthrough to panes that are currently visible.
set -g allow-passthrough on

# The wheel scrolls tmux's scrollback, because nothing else can.
#
# tmux occupies the terminal's alternate screen, and no terminal keeps scrollback
# for that screen - so the emulator's own history stays empty and its wheel has
# nothing to show. tmux holds the only scrollback there is, and reaches it by wheel
# only with mouse on. The default binding still forwards the wheel to full-screen
# programs that read it themselves (less, vim) rather than scrolling past them.
#
# Dragging now selects into a tmux buffer instead of the terminal's; hold Shift to
# bypass tmux and select with the emulator for the X clipboard.
set -g mouse on

# Scrollback deep enough to hold a build log; tmux defaults to 2000 lines.
set -g history-limit 50000
